<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A skyline blending Lille and Jaipur landmarks">
  <defs>
    <linearGradient id="ifg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b1f2a"/>
      <stop offset="0.55" stop-color="#a85d2a"/>
      <stop offset="1" stop-color="#c9962b"/>
    </linearGradient>
  </defs>

  <g fill="url(#ifg)" fill-opacity="0.14">

    <!-- ===== Lille (left) ===== -->

    <!-- Belfry of Lille: tall blocky Art-Deco tower -->
    <rect x="150" y="120" width="38" height="180"/>
    <rect x="146" y="114" width="46" height="8"/>
    <rect x="157" y="74" width="24" height="44"/>
    <path d="M157 76 L169 54 L181 76 Z"/>
    <rect x="166" y="40" width="6" height="16"/>
    <circle cx="169" cy="36" r="4"/>

    <!-- Flemish stepped-gable house 1 (Vieille Bourse style) -->
    <path d="M214 300 L214 246 L221 246 L221 240 L228 240 L228 234 L235 234 L235 228 L242 228 L242 222 L250 222 L250 228 L257 228 L257 234 L264 234 L264 240 L271 240 L271 246 L278 246 L278 300 Z"/>
    <rect x="243" y="256" width="6" height="16"/>

    <!-- Flemish stepped-gable house 2 -->
    <path d="M290 300 L290 252 L296 252 L296 247 L302 247 L302 242 L308 242 L308 237 L314 237 L314 232 L321 232 L321 237 L327 237 L327 242 L333 242 L333 247 L339 247 L339 252 L345 252 L345 300 Z"/>
    <rect x="314" y="262" width="5" height="12"/>

    <!-- Column of the Goddess (Grand'Place) -->
    <rect x="372" y="150" width="7" height="150"/>
    <rect x="368" y="146" width="15" height="6"/>
    <circle cx="375.5" cy="138" r="7"/>

    <!-- Union heart, centre -->
    <path d="M600 56
      C594 45 577 47 577 60
      C577 72 594 80 600 87
      C606 80 623 72 623 60
      C623 47 606 45 600 56 Z"/>

    <!-- ===== Jaipur (right): Hawa Mahal ===== -->

    <!-- Base wall with crenellations -->
    <rect x="838" y="272" width="324" height="28"/>
    <g>
      <rect x="842" y="264" width="12" height="10"/>
      <rect x="870" y="264" width="12" height="10"/>
      <rect x="898" y="264" width="12" height="10"/>
      <rect x="926" y="264" width="12" height="10"/>
      <rect x="954" y="264" width="12" height="10"/>
      <rect x="982" y="264" width="12" height="10"/>
      <rect x="1010" y="264" width="12" height="10"/>
      <rect x="1038" y="264" width="12" height="10"/>
      <rect x="1066" y="264" width="12" height="10"/>
      <rect x="1094" y="264" width="12" height="10"/>
      <rect x="1122" y="264" width="12" height="10"/>
      <rect x="1146" y="264" width="12" height="10"/>
    </g>

    <!-- Tiered pyramidal facade -->
    <path d="M882 272 L882 244 L902 244 L902 218 L922 218 L922 194 L944 194 L944 172 L970 172 L970 152 L1030 152 L1030 172 L1056 172 L1056 194 L1078 194 L1078 218 L1098 218 L1098 244 L1118 244 L1118 272 Z"/>

    <!-- Central onion dome + finial -->
    <path d="M984 152 C978 130 1022 130 1016 152 Z"/>
    <rect x="997" y="112" width="6" height="20"/>
    <circle cx="1000" cy="108" r="6"/>

    <!-- Small chhatri domes on the tiers -->
    <path d="M906 218 C902 202 936 202 934 218 Z"/>
    <path d="M1066 218 C1062 202 1096 202 1094 218 Z"/>
    <path d="M928 172 C925 158 955 158 953 172 Z"/>
    <path d="M1047 172 C1044 158 1074 158 1072 172 Z"/>

  </g>
</svg>
